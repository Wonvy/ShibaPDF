<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>ShibaPDF — PDF 编辑与印前工作台</title>
  <style>
/*__INLINE_CSS__*/
  </style>
</head>
<body>
  <div class="workbench">
    <!-- Left Column: Borderless Large Feature Buttons -->
    <aside class="left-rail">
      <header class="rail-header">
        <div class="brand-mark">
          <i data-lucide="book-open"></i>
          <span>ShibaPDF</span>
        </div>
        <div class="header-mini-btns">
          <button id="langBtn" class="ghost-btn" type="button" title="Switch Language">
            <i data-lucide="languages"></i>
            <span id="langLabel">EN</span>
          </button>
          <button id="themeBtn" class="ghost-btn" type="button" title="Toggle Theme">
            <span id="iconMoon"><i data-lucide="moon"></i></span>
            <span id="iconSun" class="hidden"><i data-lucide="sun"></i></span>
          </button>
        </div>
      </header>

      <nav class="rail-tools" aria-label="PDF Tools">
        <button id="navEditBtn" class="big-tool-btn active" type="button">
          <span class="tool-icon-box">
            <i data-lucide="square-pen"></i>
          </span>
          <span class="tool-btn-copy">
            <span class="tool-btn-title-row">
              <span class="tool-btn-title" data-i18n="modeEdit">编辑页面</span>
            </span>
            <span class="tool-btn-desc" data-i18n="modeEditSub">修改或添加文字 · 旋转与删页</span>
          </span>
        </button>

        <button id="navPreflightBtn" class="big-tool-btn" type="button">
          <span class="tool-icon-box">
            <i data-lucide="shield-check"></i>
          </span>
          <span class="tool-btn-copy">
            <span class="tool-btn-title-row">
              <span class="tool-btn-title" data-i18n="modePreflight">印前检查</span>
              <span id="navPreflightBadge" class="status-pill hidden"></span>
            </span>
            <span class="tool-btn-desc" data-i18n="modePreflightSub">8 项规范体检 · 点击定位高亮</span>
          </span>
        </button>

        <button id="navKeepBtn" class="big-tool-btn" type="button">
          <span class="tool-icon-box">
            <i data-lucide="printer"></i>
          </span>
          <span class="tool-btn-copy">
            <span class="tool-btn-title-row">
              <span class="tool-btn-title" data-i18n="modeKeepK100">印前单黑</span>
            </span>
            <span class="tool-btn-desc" data-i18n="modeKeepSub">原尺寸直出 · 四色黑转 K100</span>
          </span>
        </button>

        <button id="navSplitBtn" class="big-tool-btn" type="button">
          <span class="tool-icon-box">
            <i data-lucide="columns-2"></i>
          </span>
          <span class="tool-btn-copy">
            <span class="tool-btn-title-row">
              <span class="tool-btn-title" data-i18n="modeSplit">跨页拆单页</span>
            </span>
            <span class="tool-btn-desc" data-i18n="modeSplitSub">双页切单页 · 出血与封底归位</span>
          </span>
        </button>
      </nav>

      <div class="rail-footer">
        <input id="fileInput" type="file" accept=".pdf,application/pdf" multiple class="hidden" />

        <div id="railFilesBox" class="rail-files-box hidden">
          <div class="rail-files-head">
            <span data-i18n="secFiles">当前文档</span>
            <div style="display:flex;gap:4px;">
              <button id="addMoreBtn" class="ghost-btn" style="height:22px;padding:0 6px;font-size:11px;" type="button">
                <i data-lucide="plus" style="width:11px;height:11px;"></i>
                <span data-i18n="addBtn">添加</span>
              </button>
              <button id="clearAllBtn" class="ghost-btn" style="height:22px;padding:0 6px;font-size:11px;" type="button">
                <span data-i18n="clearAll">清空</span>
              </button>
            </div>
          </div>
          <div id="fileList" class="rail-file-list"></div>
        </div>

        <button id="sidebarUploadBtn" class="rail-soft-btn" type="button">
          <i data-lucide="upload"></i>
          <span data-i18n="addPdfBtn">打开 PDF 文件</span>
        </button>

        <button id="downloadOfflineBtn" class="rail-soft-btn" type="button" title="Save standalone ShibaPDF.html to use offline on your computer">
          <i data-lucide="hard-drive-download"></i>
          <span data-i18n="downloadOfflineBtn">下载单文件离线版</span>
        </button>
      </div>
    </aside>

    <!-- Right Column: Progressive Workspace -->
    <main class="right-workspace">
      <!-- Quiet Progressive Top Action Strip (Hidden when no PDF is loaded) -->
      <header id="topStrip" class="top-action-strip hidden">
        <div class="strip-left">
          <!-- Mode: Edit Page Controls -->
          <div id="stripEditTools" class="strip-left">
            <button id="addTextBtn" class="ghost-btn" type="button">
              <i data-lucide="type"></i>
              <span data-i18n="addTextBtn">添加文字</span>
            </button>
            <button id="rotatePageBtn" class="ghost-btn" type="button">
              <i data-lucide="rotate-cw"></i>
              <span data-i18n="rotatePageBtn">旋转本页</span>
            </button>
            <button id="deletePageBtn" class="ghost-btn" type="button">
              <i data-lucide="trash-2"></i>
              <span data-i18n="deletePageBtn">删除本页</span>
            </button>
            <button id="undoEditBtn" class="ghost-btn hidden" type="button">
              <i data-lucide="undo-2"></i>
              <span data-i18n="undoBtn">撤销</span>
            </button>
            <span id="editHintLabel" style="font-size:12px;color:var(--text-3);margin-left:4px;" data-i18n="editClickHint">点击页面已有文字可直接修改</span>
          </div>

          <!-- Mode: Preflight Summary -->
          <div id="stripPreflightTools" class="strip-left hidden">
            <span style="font-size:13.5px;font-weight:600;" data-i18n="preflightReportTitle">印前规范检查</span>
            <div id="pfScorePills" style="display:flex;gap:6px;"></div>
          </div>

          <!-- Mode: Keep K100 Summary -->
          <div id="stripKeepTools" class="strip-left hidden">
            <div class="soft-pills">
              <button id="keepTabSingle" class="soft-pill active" type="button" data-i18n="viewSingle">单张查看</button>
              <button id="keepTabAll" class="soft-pill" type="button" data-i18n="tabSequence">全部页面</button>
            </div>
            <span style="font-size:12px;color:var(--text-2);margin-left:6px;" data-i18n="keepDescInline">保持原跨页尺寸与出血 · 自动转单色黑 K100 并保留透明度</span>
          </div>

          <!-- Mode: Split Spreads Progressive Controls (Parameters tucked inside popover!) -->
          <div id="stripSplitTools" class="strip-left hidden">
            <div class="soft-pills">
              <button id="tabSpreadBtn" class="soft-pill active" type="button" data-i18n="tabSpread">裁切预览</button>
              <button id="tabSeqBtn" class="soft-pill" type="button" data-i18n="tabSequence">拆后总览</button>
            </div>

            <div class="popover-anchor">
              <button id="splitParamsBtn" class="ghost-btn active" type="button">
                <i data-lucide="sliders-horizontal"></i>
                <span id="splitParamsSummary">出血 3mm · 拆分设置</span>
                <i data-lucide="chevron-down" style="width:13px;height:13px;"></i>
              </button>

              <!-- Progressive Disclosure Settings Popover -->
              <div id="splitParamsPopover" class="popover-card hidden">
                <div class="pop-label" data-i18n="secBleed">四周出血尺寸</div>
                <div class="soft-pills" style="width:100%;display:grid;grid-template-columns:repeat(3,1fr);">
                  <button class="soft-pill preset-chip" data-bleed="0" type="button" data-i18n="preset0">无 0</button>
                  <button class="soft-pill preset-chip active" data-bleed="3" type="button">3mm</button>
                  <button class="soft-pill preset-chip" data-bleed="5" type="button">5mm</button>
                </div>

                <div class="pop-row">
                  <span data-i18n="bleedUniformLabel">统一出血</span>
                  <span class="num-pill">
                    <input id="bleedUniformInput" type="number" min="0" max="50" step="0.5" value="3" />
                    <span class="unit-txt">mm</span>
                  </span>
                </div>

                <button id="toggleQuadLink" class="ghost-btn" style="justify-content:flex-start;padding:0 4px;height:24px;font-size:11.5px;" type="button" data-i18n="toggleQuadText">展开上/下/左/右独立微调 ▾</button>

                <div id="quadGridPop" class="quad-grid-pop hidden">
                  <label class="pop-row"><span data-i18n="sideTop">上</span><span class="num-pill"><input id="bleedTopInput" type="number" min="0" max="50" step="0.5" value="3" /></span></label>
                  <label class="pop-row"><span data-i18n="sideBottom">下</span><span class="num-pill"><input id="bleedBottomInput" type="number" min="0" max="50" step="0.5" value="3" /></span></label>
                  <label class="pop-row"><span data-i18n="sideLeft">左</span><span class="num-pill"><input id="bleedLeftInput" type="number" min="0" max="50" step="0.5" value="3" /></span></label>
                  <label class="pop-row"><span data-i18n="sideRight">右</span><span class="num-pill"><input id="bleedRightInput" type="number" min="0" max="50" step="0.5" value="3" /></span></label>
                </div>

                <label class="pop-row" style="cursor:pointer;">
                  <span data-i18n="moveFirstShort">首张左页（封底）移至末页</span>
                  <span class="switch-ctrl"><input id="moveFirstCheck" type="checkbox" checked /><span class="switch-track"></span></span>
                </label>

                <label class="pop-row" style="cursor:pointer;">
                  <span data-i18n="pureBlackShort">同步转为印刷单色黑 K100</span>
                  <span class="switch-ctrl"><input id="pureBlackCheck" type="checkbox" checked /><span class="switch-track"></span></span>
                </label>

                <label class="pop-row" style="cursor:pointer;">
                  <span data-i18n="onlyLandscapeShort">仅拆分横向跨页</span>
                  <span class="switch-ctrl"><input id="onlyLandscapeCheck" type="checkbox" checked /><span class="switch-track"></span></span>
                </label>

                <div class="soft-pills" style="width:100%;display:grid;grid-template-columns:1fr 1fr;">
                  <button id="bleedTrimBtn" class="soft-pill active" type="button" data-i18n="actionTrimShort">裁除出血</button>
                  <button id="bleedKeepBtn" class="soft-pill" type="button" data-i18n="actionKeepShort">保留外出血</button>
                </div>

                <div class="soft-pills" style="width:100%;display:grid;grid-template-columns:1fr 1fr;">
                  <button id="dirLtrBtn" class="soft-pill active" type="button" data-i18n="dirLtrShort">左 → 右</button>
                  <button id="dirRtlBtn" class="soft-pill" type="button" data-i18n="dirRtlShort">右 → 左</button>
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="strip-right">
          <span id="dimSummaryText" style="font-size:12px;color:var(--text-2);font-variant-numeric:tabular-nums;"></span>
          <button id="exportBtn" class="primary-btn" type="button" disabled>
            <i data-lucide="download"></i>
            <span id="exportBtnText" data-i18n="exportPdfBtn">导出 PDF</span>
          </button>
        </div>
      </header>

      <!-- Workspace Main Body (Optional Left Preflight Drawer + Live Canvas Stage) -->
      <div class="workspace-body">
        <!-- Interactive Preflight List (Click any issue to jump & highlight on the live canvas!) -->
        <aside id="preflightDrawer" class="preflight-drawer hidden"></aside>

        <div id="stageViewport" class="stage-viewport">
          <!-- Empty State -->
          <div id="emptyStage" class="center-placeholder">
            <div id="dropzone" class="drop-surface" role="button" tabindex="0">
              <h2 data-i18n="emptyHeading">打开或拖入 PDF 文件</h2>
              <p data-i18n="emptySub">左侧选择工具，即可在本地完成页面文字编辑、印前规范定位体检、四色黑修复或跨页拆分</p>
              <div class="drop-cta">
                <i data-lucide="upload"></i>
                <span data-i18n="chooseBtn">选择 PDF 文件</span>
              </div>
            </div>
            <div class="empty-foot" data-i18n="localFootnote">100% 浏览器本地处理 · 支持 Ctrl + 滚轮无级缩放画布</div>
          </div>

          <!-- Paper Canvas + Multi-Mode Interactive Overlays -->
          <div id="spreadViewContainer" class="paper-frame hidden">
            <canvas id="spreadCanvas"></canvas>

            <!-- Layer 1: Split Cut Guides -->
            <div id="guidesOverlay" class="overlay-layer hidden">
              <div id="shadeTop" class="bleed-bar"></div>
              <div id="shadeBottom" class="bleed-bar"></div>
              <div id="shadeLeft" class="bleed-bar"></div>
              <div id="shadeRight" class="bleed-bar"></div>
              <div id="trimRect" class="trim-box-line"></div>
              <div id="centerLine" class="center-cut-line"></div>
              <div id="leftBadge" class="minimal-badge"></div>
              <div id="rightBadge" class="minimal-badge"></div>
            </div>

            <!-- Layer 2: Preflight Issue Spotlight Highlights -->
            <div id="pfHighlightOverlay" class="overlay-layer hidden"></div>

            <!-- Layer 3: Interactive Page Text Editor -->
            <div id="textEditOverlay" class="overlay-layer interactive hidden"></div>
          </div>

          <!-- All-Pages Grid View -->
          <div id="sequenceGrid" class="clean-grid hidden"></div>
        </div>
      </div>

      <!-- Floating Mini Text Formatting Toolbar (Appears only when editing a text node) -->
      <div id="textFmtBar" class="text-fmt-bar hidden">
        <button id="fmtSmallerBtn" class="pager-btn" type="button" title="减小字号">A−</button>
        <span id="fmtSizeLabel" style="font-size:11.5px;font-weight:600;min-width:30px;text-align:center;">14</span>
        <button id="fmtLargerBtn" class="pager-btn" type="button" title="增大字号">A+</button>
        <button id="fmtBoldBtn" class="pager-btn" type="button" style="font-weight:700;" title="加粗">B</button>
        <input id="fmtColorInput" class="fmt-color-input" type="color" value="#181817" title="文字颜色" />
        <label style="display:inline-flex;align-items:center;gap:3px;font-size:11px;color:var(--text-2);cursor:pointer;" title="遮盖底部原文字">
          <input id="fmtMaskCheck" type="checkbox" checked />
          <span data-i18n="maskBgLabel">遮底</span>
        </label>
        <input id="fmtBgInput" class="fmt-color-input" type="color" value="#ffffff" title="背景遮盖色" />
        <button id="fmtDeleteNodeBtn" class="del-icon-btn" type="button" title="删除此文字框">
          <i data-lucide="trash-2"></i>
        </button>
      </div>

      <!-- Floating Bottom Pager & Zoom -->
      <div id="bottomPager" class="floating-pager hidden">
        <button id="prevSpreadBtn" class="pager-btn" type="button" aria-label="Previous">
          <i data-lucide="chevron-left"></i>
        </button>
        <span id="pageIndicator" class="pager-text">1 / 1</span>
        <button id="nextSpreadBtn" class="pager-btn" type="button" aria-label="Next">
          <i data-lucide="chevron-right"></i>
        </button>
        <button id="zoomOutBtn" class="pager-btn" type="button" title="Zoom Out">
          <i data-lucide="minus"></i>
        </button>
        <button id="zoomFitBtn" class="pager-btn" type="button" style="width:auto;padding:0 7px;font-size:11.5px;font-weight:500;">
          <span id="zoomLabel">100%</span>
        </button>
        <button id="zoomInBtn" class="pager-btn" type="button" title="Zoom In">
          <i data-lucide="plus"></i>
        </button>
      </div>
    </main>
  </div>

  <!-- Embedded Offline Engines -->

</body>
</html>
